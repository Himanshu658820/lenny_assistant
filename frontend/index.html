<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenny Growth Assistant</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- HTML Sanitizer (Security Requirement) -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .typing-dot { animation: blink 1.4s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
    
    /* Prose styling for Markdown artifacts */
    .prose h1 { font-size: 2em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
    .prose h2 { font-size: 1.5em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
    .prose h3 { font-size: 1.25em; font-weight: bold; margin-top: 0.8em; margin-bottom: 0.4em; }
    .prose p { margin-bottom: 1em; line-height: 1.6; }
    .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
    .prose li { margin-bottom: 0.25em; }
    .prose strong { font-weight: bold; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-72 bg-slate-900 text-slate-200 flex flex-col border-r border-slate-800">
    <div class="p-4 border-b border-slate-800">
      <button id="btn-new-chat" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
        New Chat
      </button>
    </div>
    <div class="p-4 border-b border-slate-800">
      <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Model Provider</label>
      <select id="provider-select" class="w-full bg-slate-800 border border-slate-700 rounded-md p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
        <option value="ollama">Ollama (Local)</option>
        <option value="anthropic">Anthropic (Cloud)</option>
        <option value="openai">OpenAI (Cloud)</option>
      </select>
    </div>
    <nav id="session-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      <!-- Sessions injected here -->
    </nav>
    <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
      Lenny Growth Assistant v0.4
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col relative">
    <header class="h-16 border-b border-slate-200 bg-white flex items-center px-6 justify-between shadow-sm">
      <h1 id="chat-title" class="text-lg font-semibold text-slate-700">New Conversation</h1>
    </header>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6 bg-slate-50">
      <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
        <p class="text-lg font-medium">Ask a question about Lenny's Podcast</p>
        <p class="text-sm mt-1">Try: "How do I improve retention?" or "Write a Ship 30 essay about onboarding."</p>
      </div>
    </div>

    <form id="chat-form" class="p-4 bg-white border-t border-slate-200">
      <div class="max-w-4xl mx-auto flex gap-3">
        <textarea id="chat-input" rows="1" class="flex-1 resize-none rounded-xl border border-slate-300 p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="Type your message... (Shift+Enter for new line)"></textarea>
        <button type="submit" id="btn-send" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 rounded-xl font-medium transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[80px]">
          Send
        </button>
      </div>
    </form>
  </main>

  <!-- Artifact Viewer Pane (Hidden by default) -->
  <aside id="artifact-pane" class="w-1/2 bg-white border-l border-slate-200 hidden flex-col shadow-xl">
    <header class="h-16 border-b border-slate-200 flex items-center justify-between px-6 bg-slate-50">
      <h2 id="artifact-title" class="text-lg font-semibold text-slate-700 truncate">Artifact</h2>
      <div class="flex items-center gap-4">
        <span id="artifact-meta" class="text-xs text-slate-500 bg-slate-200 px-2 py-1 rounded"></span>
        <button id="btn-close-artifact" class="text-slate-400 hover:text-slate-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
    </header>
    <div id="artifact-content" class="flex-1 overflow-auto p-8 bg-white">
      <!-- Artifact injected here securely -->
    </div>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
